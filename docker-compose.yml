version: '3.8'

volumes:
  webhook_logs:
  minio_storage:

networks:
  n8n_network:

services:
  postgres-db:
    image: postgres:16
    container_name: postgres-db
    restart: always
    environment:
      - POSTGRES_USER=myuser
      - POSTGRES_PASSWORD=mypassword
      - POSTGRES_DB=cs_database
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./infra/postgres/init-postgres.sql:/docker-entrypoint-initdb.d/init-postgres.sql
    networks:
      - n8n_network
    ports:
      - "5432:5432" # 로컬 DB 툴(DBeaver 등)에서 접속하기 위한 포트

  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: n8n
    restart: always
    env_file:
      - .env
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_DATABASE=cs_database
      - DB_POSTGRESDB_HOST=postgres-db # n8n이 DB를 찾을 때 사용하는 주소
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_USER=myuser
      - DB_POSTGRESDB_PASSWORD=mypassword
      - DB_POSTGRESDB_SCHEMA=n8n_schema
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=${WEBHOOK_URL:-}
      - N8N_EDITOR_BASE_URL=${WEBHOOK_URL:-http://localhost:5678/}
      - N8N_PROXY_HOPS=1
      - GENERIC_TIMEZONE=Asia/Seoul
    ports:
      - "5678:5678"
    volumes:
      - ./data/n8n:/home/node/.n8n
    networks:
      - n8n_network
    depends_on:
      - postgres-db

  minio:
    image: minio/minio:latest
    container_name: minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadminpassword}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_storage:/data
    command: server /data --console-address ":9001"
    networks:
      - n8n_network

  cs-api:
    build:
      context: ./backend
    container_name: cs-api
    restart: always
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/cs_database
      - SPRING_DATASOURCE_USERNAME=myuser
      - SPRING_DATASOURCE_PASSWORD=mypassword
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN:-changeme}
      - NAVER_SESSION_RENEW_TRIGGER_URL=${NAVER_SESSION_RENEW_TRIGGER_URL:-}
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - S3_SECRET_KEY=${MINIO_SECRET_KEY:-minioadminpassword}
      - S3_BUCKET=${MINIO_BUCKET:-kakao-webhook-logs}
      - S3_REGION=us-east-1
      - S3_EXTERNAL_URL=http://localhost:8888/attachments
    volumes:
      - webhook_logs:/app/logs/webhooks
    depends_on:
      - postgres-db
    networks:
      - n8n_network

  browser-worker:
    build:
      context: ./browser-worker
    container_name: browser-worker
    restart: always
    environment:
      - BACKEND_API_URL=http://cs-api:8080
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN:-changeme}
    depends_on:
      - cs-api
    networks:
      - n8n_network
    ports:
      - "3000:3000"

  frontend:
    image: nginx:alpine
    container_name: cs-frontend-nginx
    restart: always
    ports:
      - "8888:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./infra/nginx/.htpasswd:/etc/nginx/.htpasswd
    depends_on:
      - cs-api
    networks:
      - n8n_network

  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c " until (/usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadminpassword); do echo 'Waiting for MinIO...'; sleep 1; done; /usr/bin/mc mb --ignore-existing myminio/kakao-webhook-logs; /usr/bin/mc anonymous set download myminio/kakao-webhook-logs; echo 'Bucket kakao-webhook-logs created and download policy set!'; exit 0; "
    networks:
      - n8n_network
