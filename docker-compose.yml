volumes:
  app_logs:
  minio_storage:
  loki_data:
  grafana_data:

networks:
  n8n_network:

services:
  postgres-db:
    image: postgres:16
    container_name: postgres-db
    restart: always
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=cs_database
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./infra/postgres/init-postgres.sql:/docker-entrypoint-initdb.d/init-postgres.sql
    networks:
      - n8n_network
    ports:
      - "5432:5432" # 로컬 DB 툴(DBeaver 등)에서 접속하기 위한 포트

  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: n8n
    restart: always
    env_file:
      - .env
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_DATABASE=cs_database
      - DB_POSTGRESDB_HOST=postgres-db # n8n이 DB를 찾을 때 사용하는 주소
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_USER=${DB_USERNAME}
      - DB_POSTGRESDB_PASSWORD=${DB_PASSWORD}
      - DB_POSTGRESDB_SCHEMA=n8n_schema
      - N8N_HOST=${N8N_HOST}
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_PATH=/n8n/
      - NODE_ENV=production
      - WEBHOOK_URL=${WEBHOOK_URL:-http://localhost:8888/n8n/}
      - N8N_EDITOR_BASE_URL=${N8N_EDITOR_BASE_URL:-http://localhost:8888/n8n/}
      - N8N_PROXY_HOPS=1
      - GENERIC_TIMEZONE=Asia/Seoul
    volumes:
      - ./data/n8n:/home/node/.n8n
    networks:
      - n8n_network
    depends_on:
      - postgres-db
    dns:
      - 8.8.8.8
      - 8.8.4.4

  minio:
    image: minio/minio:latest
    container_name: minio
    restart: always
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
      MINIO_BROWSER_REDIRECT_URL: http://localhost:8888/minio/
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_storage:/data
    command: server /data --console-address ":9001"
    networks:
      - n8n_network

  cs-api:
    build:
      context: ./apps/cs-api
    container_name: cs-api
    restart: always
    env_file:
      - .env
    volumes:
      - app_logs:/app/logs
      - ./infra/nginx/.htpasswd:/app/config/.htpasswd
    depends_on:
      - postgres-db
    networks:
      - n8n_network

  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: always
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./infra/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    networks:
      - n8n_network

  grafana-alloy:
    image: grafana/alloy:latest
    container_name: grafana-alloy
    restart: always
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    volumes:
      - ./infra/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - app_logs:/app/logs:ro
    depends_on:
      - loki
    networks:
      - n8n_network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: always
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-http://localhost:8888/grafana/}
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - loki
    networks:
      - n8n_network

  browser-worker:
    build:
      context: ./apps/browser-worker
    container_name: browser-worker
    restart: always
    env_file:
      - .env
    environment:
      - BACKEND_API_URL=http://cs-api:8080
    depends_on:
      - cs-api
    networks:
      - n8n_network
    dns:
      - 8.8.8.8
      - 8.8.4.4

  frontend:
    image: nginx:alpine
    container_name: cs-frontend-nginx
    restart: always
    ports:
      - "8888:80"
    volumes:
      - ./apps/frontend/dist:/usr/share/nginx/html
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./infra/nginx/.htpasswd:/etc/nginx/.htpasswd
    depends_on:
      - cs-api
    networks:
      - n8n_network

  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c " until (/usr/bin/mc alias set myminio http://minio:9000 ${S3_ACCESS_KEY} ${S3_SECRET_KEY}); do echo 'Waiting for MinIO...'; sleep 1; done; /usr/bin/mc mb --ignore-existing myminio/${S3_BUCKET}; /usr/bin/mc anonymous set download myminio/${S3_BUCKET}; echo 'Bucket ${S3_BUCKET} created and download policy set!'; exit 0; "
    networks:
      - n8n_network

  n8n-sync:
    image: node:24-alpine
    container_name: n8n-sync
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/app
    working_dir: /app
    command: >
      sh -c "
        apk add --no-cache docker-cli &&
        node infra/n8n/n8n-sync.js
      "
    depends_on:
      - n8n
    networks:
      - n8n_network

  wiki:
    image: node:22-alpine
    container_name: cs-wiki
    restart: always
    working_dir: /app
    command: sh -c "npm install && npm run start -- --host 0.0.0.0 --port 80"
    volumes:
      - ./docs:/app
      - /app/node_modules
      - /app/.docusaurus
    environment:
      - BACKEND_API_URL=http://cs-api:8080/v3/api-docs
    depends_on:
      - cs-api
    networks:
      - n8n_network


