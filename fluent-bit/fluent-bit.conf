[SERVICE]
    Flush        1
    Daemon       Off
    Log_Level    info
    Parsers_File /fluent-bit/etc/parsers.conf

[INPUT]
    Name             tail
    Path             /app/logs/webhooks/skill.log
    Parser           json
    Tag              webhook.skill
    DB               /fluent-bit/state/webhook_skill.db
    Mem_Buf_Limit    5MB
    Skip_Long_Lines  On
    Refresh_Interval 2

[INPUT]
    Name             tail
    Path             /app/logs/webhooks/validation.log
    Parser           json
    Tag              webhook.validation
    DB               /fluent-bit/state/webhook_validation.db
    Mem_Buf_Limit    5MB
    Skip_Long_Lines  On
    Refresh_Interval 2

# 1. Nest the entire raw JSON payload under the "body" field to conform to OTEL specs
[FILTER]
    Name          nest
    Match         webhook.*
    Operation     nest
    Wildcard      *
    Nest_under    body

# 2. Add OpenTelemetry metadata for skill webhook logs
[FILTER]
    Name             record_modifier
    Match            webhook.skill
    Record           severityText INFO
    Record           severityNumber 9
    Record           service.name cs-api
    Record           service.version 0.0.1-SNAPSHOT
    Record           log.type skill

# 3. Add OpenTelemetry metadata for validation webhook logs
[FILTER]
    Name             record_modifier
    Match            webhook.validation
    Record           severityText INFO
    Record           severityNumber 9
    Record           service.name cs-api
    Record           service.version 0.0.1-SNAPSHOT
    Record           log.type validation

# 4. Nest service.name and service.version under resource (OTel spec compliance)
[FILTER]
    Name          nest
    Match         webhook.*
    Operation     nest
    Wildcard      service.*
    Nest_under    resource

# 5. Nest log.type under attributes (OTel spec compliance)
[FILTER]
    Name          nest
    Match         webhook.*
    Operation     nest
    Wildcard      log.type
    Nest_under    attributes

# [OUTPUT 1] S3 (MinIO) Log storage (Data Lake / DuckDB analysis)
[OUTPUT]
    Name                         s3
    Match                        webhook.*
    bucket                       kakao-webhook-logs
    region                       us-east-1
    endpoint                     http://minio:9000
    use_put_object               On
    s3_key_format                /type=$TAG[1]/year=%Y/month=%m/day=%d/%H-%M-%S-$UUID.json
    s3_key_format_tag_delimiters .
    total_file_size              1M
    upload_timeout               10s
    json_date_key                timestamp
    json_date_format             iso8601

# [OUTPUT 2] Loki Log storage (Grafana real-time search)
[OUTPUT]
    Name                         loki
    Match                        webhook.*
    Host                         loki
    Port                         3100
    Labels                       job=webhook, type=$TAG[1]
