spring:
  threads:
    virtual:
      enabled: true
  application:
    name: cs-api

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

security:
  internal:
    token: ${INTERNAL_API_TOKEN}

# Nginx Basic Auth 계정은 DB(admin_member)를 기준으로 관리합니다.
admin:
  htpasswd-path: ${ADMIN_HTPASSWD_PATH:/app/config/.htpasswd}

naver:
  session:
    renew-trigger-url: ${NAVER_SESSION_RENEW_TRIGGER_URL:}

s3:
  endpoint: ${S3_ENDPOINT:http://localhost:9000}
  access-key: ${S3_ACCESS_KEY}
  secret-key: ${S3_SECRET_KEY}
  bucket: ${S3_BUCKET:kakao-webhook-logs}
  region: ${S3_REGION:ap-northeast-2}
  external-url: ${S3_EXTERNAL_URL:http://localhost:9000}

server:
  port: 8080

logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG

resilience4j:
  circuitbreaker:
    instances:
      antiAbuseService:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 5
        minimumNumberOfCalls: 3
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: 4s
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 2
        automaticTransitionFromOpenToHalfOpenEnabled: true
  retry:
    instances:
      antiAbuseService:
        maxAttempts: 3
        waitDuration: 500ms

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /internal/actuator
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}
