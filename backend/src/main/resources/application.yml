spring:
  threads:
    virtual:
      enabled: true
  application:
    name: cs-api

  datasource:
    url: jdbc:postgresql://postgres-db:5432/cs_database
    username: myuser
    password: mypassword

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

security:
  internal:
    token: ${INTERNAL_API_TOKEN:changeme}

naver:
  session:
    renew-trigger-url: ${NAVER_SESSION_RENEW_TRIGGER_URL:}

server:
  port: 8080

logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG

resilience4j:
  circuitbreaker:
    instances:
      antiAbuseService:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 5
        minimumNumberOfCalls: 3
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: 4s
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 2
        automaticTransitionFromOpenToHalfOpenEnabled: true
  retry:
    instances:
      antiAbuseService:
        maxAttempts: 3
        waitDuration: 500ms

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
