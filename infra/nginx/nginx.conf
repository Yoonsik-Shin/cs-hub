server {
    listen 80;
    server_name localhost;

    # ==========================================
    # 1. LAN 접근 제한 (사설 IP 대역 전체 일괄 허용)
    # ==========================================
    allow 127.0.0.1;        # Localhost (본인 PC)
    allow 192.168.0.0/16;   # 일반적인 가정/사무실 C클래스 사설망 대역 전체 허용
    allow 10.0.0.0/8;       # 기업용/대형 네트워크 A클래스 사설망 대역 전체 허용
    allow 172.16.0.0/12;    # Docker 내부망 및 B클래스 사설망 대역 전체 허용
    deny all;               # 위 사설망 대역을 제외한 외부 모든 공인 IP 차단 (3G/LTE, 외부 등)

    # ==========================================
    # 2. 공유 오피스 대비 로그인 기본 인증 (Basic Auth)
    # ==========================================
    auth_basic "Restricted Access - CS System";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # ==========================================
    # Docker 내부 DNS Resolver (IP 변경 실시간 감지용)
    # ==========================================
    resolver 127.0.0.11 valid=10s;

    # ==========================================
    # 3. 프론트엔드 정적 파일 서빙
    # ==========================================
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html; # SPA(React) 라우팅 지원
    }

    # ==========================================
    # 4. 백엔드 API 리버스 프록시 (Spring Boot 연결)
    # ==========================================
    location /api/ {
        set $backend_upstream http://cs-api:8080;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ==========================================
    # 5. API 문서 리버스 프록시 (Redoc 및 Swagger)
    # ==========================================
    location /docs {
        set $backend_upstream http://cs-api:8080;
        proxy_pass $backend_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /v3/api-docs {
        set $backend_upstream http://cs-api:8080;
        proxy_pass $backend_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /swagger-ui/ {
        set $backend_upstream http://cs-api:8080;
        proxy_pass $backend_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
